
<!DOCTYPE html>
<html>
<head>
    <title>GET and POST Form</title>
</head>
<body>
    <h2>Student Form</h2>

    <form action="request" method="get">
        Name:
        <input type="text" name="name" required>
        <button type="submit">Send GET</button>
    </form>

    <br>

    <form action="request" method="post">
        Name:
        <input type="text" name="name" required>
        <button type="submit">Send POST</button>
    </form>

</body>
</html>
